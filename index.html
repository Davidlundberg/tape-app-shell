  ok("Schema: a card without sources is caught", /c9-b: no valid sources/.test(errs));
  ok("Schema: a volatile card without asOf/recheckBy is caught", /c9-b: volatile card needs asOf/.test(errs) && /c9-b: volatile card needs recheckBy/.test(errs));
  ok("Schema: a Say it missing a client part is caught", /c9-c\.client: bridge missing/.test(errs));
  ok("Schema: an on-air number part with no figure is caught", /c9-c\.air: number part has no figure/.test(errs));
  ok("Schema: fewer than 3 follow-ups is caught", /2 follow-ups/.test(errs));
  ok("Schema: a non-volatile live card and a non-http link are caught", /c9-d: live cards must be volatile/.test(errs) && /c9-d: no valid sources/.test(errs));
  (function(){
    var live={id:"c9-live", kind:"live", title:"t", status:"s", oneLine:"o", volatile:true, asOf:"2026-10", recheckBy:"2027-01", sources:src};
    var ch9={n:9, title:"Live", cards:[live], followUps:[
      {style:"air", asker:"Anchor interrupts", q:"Pushback <one>?", reply:{headline:"H1", why:"W1", bridge:"B1"}, sources:src},
      {style:"client", asker:"Client pushes back", q:"Pushback two?", reply:{headline:"H2", why:"W2", bridge:"B2"}, sources:src}]};
    var html=liveTeach(live, ch9);
    ok("Live: a chapter with follow-ups but no Say it cards still surfaces them",
      ch9.cards.every(function(c){ return c.kind!=="sayit"; }) && html.indexOf("The pushback you'll get")>=0 &&
      html.indexOf("Pushback &lt;one&gt;?")>=0 && html.indexOf("Pushback two?")>=0 && html.indexOf("H2")>=0 &&
      (html.match(/<details>/g)||[]).length===2);
  })();
  (function(){
    var g=JSON.parse(JSON.stringify(good));
    g.cards.push({id:"c9-r", kind:"sayit", title:"s", volatile:false, sources:src,
      air:{asker:"a", q:"q", headline:"h", why:"w", number:"5", bridge:"b"}, client:{asker:"a", q:"q", headline:"h", why:"w", number:"5", bridge:"b"},
      rephrasings:[{style:"client", asker:"x", q:"q2"}, {style:"air", asker:"y", q:"q3", answer:{headline:"h", why:"w", number:"9", bridge:"b"}}]});
    var e=Core.validateDeck({chapters:[g]}).join("\n");
    ok("Schema: a rephrasing without answer or sources is caught", /c9-r: rephrasing 1 has no answer/.test(e) && /c9-r: rephrasing 1 has no valid sources/.test(e) && /c9-r: rephrasing 2 has no valid sources/.test(e), e);
  })();
  ok("Speak: a rephrasing's reveal shows its own answer, sources and acronyms, not the parent's", (function(){
    var fake={id:"zz-test-reph", kind:"sayit", title:"t", _ch:-1, _chTitle:"t", sources:[{name:"Parent source", url:"https://example.org/p"}],
      air:{asker:"Parent asker", q:"Parent q", headline:"parent-headline", why:"parent-why uses ABC", number:"1", bridge:"parent-bridge"},
      client:{asker:"c", q:"c", headline:"c", why:"c", number:"1", bridge:"c"},
      rephrasings:[{style:"air", asker:"Other listener", q:"Reph q", answer:{headline:"reph-headline", why:"reph-why uses XYZ", number:"2", bridge:"reph-bridge"},
        sources:[{name:"Reph source", url:"https://example.org/r"}]}]};
    var keepCtx=ctx, keepView=view, keepCard=BY_ID[fake.id], html="";
    try{
      BY_ID[fake.id]=fake;
      var pr=pickPrompt(fake,"air",function(){ return 0.99; });
      ctx={queue:[fake.id], i:0, done:[], id:fake.id, style:"air", prompt:pr, phase:"reveal",
        checks:{head:false, why:false, num:false, bridge:false, jargon:false}, elapsed:null, fu:null, fuElapsed:null, fuHead:false};
      html=SCREENS.speak()[1];
    } finally { ctx=keepCtx; view=keepView; if(keepCard) BY_ID[fake.id]=keepCard; else delete BY_ID[fake.id]; }
    return pr.q==="Reph q" && html.indexOf("reph-headline")>=0 && html.indexOf("parent-headline")<0 &&
      html.indexOf("Reph source")>=0 && html.indexOf("Parent source")<0 && html.indexOf("(XYZ)")>=0 && html.indexOf("ABC")<0;
  })());
  if(DECK){ var de=Core.validateDeck(DECK); ok("Schema: the loaded deck is valid", de.length===0, de.slice(0,4).join("; ")+(de.length>4?" …":"")); }
  else results.push({name:"Schema: the loaded deck is valid (skipped, no deck loaded)", ok:true, detail:""});

  // Output safety
  ok("esc() escapes markup and quotes", Core.esc('<a href="x">\'&')==="&lt;a href=&quot;x&quot;&gt;&#39;&amp;");
  ok("Links: only http(s) are allowed", Core.safeUrl("https://sec.gov/x")==="https://sec.gov/x" && Core.safeUrl("javascript:alert(1)")===null && Core.safeUrl("data:text/html,x")===null && Core.safeUrl("//evil.example")===null);
  ok("Schema: spelled-out figures count as the on-air number", Core.validateDeck({chapters:[(function(){ var g=JSON.parse(JSON.stringify(good));
       g.cards.push({id:"c9-e", kind:"sayit", title:"s", volatile:false, sources:src,
         air:{asker:"a", q:"q", headline:"h", why:"w", number:"The Fed meets eight times a year.", bridge:"b"},
         client:{asker:"a", q:"q", headline:"h", why:"w", number:"5", bridge:"b"}}); return g; })()]}).length===0);
  ok("Delivery acronyms: generic list, skips US", Core.acronyms("The SEC and US banks, SEC again").join()==="SEC");

  // No deck content in the shell. Strings are assembled so this test can't trip itself.
  var shell=document.head.innerHTML; document.querySelectorAll("script:not([src])").forEach(function(s){ shell+=s.textContent; });
  var banned=[["Caly","pso"],["Vera","fin"],["Axiom","SL"],["Ade","na"],["FI","CC"],["12.5"," trillion"]].map(function(p){ return p.join(""); });
  var hits=banned.filter(function(b){ return shell.indexOf(b)>=0; });
  ok("Shell has no hard-coded deck content", hits.length===0, hits.join(", "));
  ok("Shell version is set", /^\d+\.\d+\.\d+$/.test(APP_VERSION));

  var failed=results.filter(function(r){ return !r.ok; }).length;
  var res={passed:results.length-failed, failed:failed, results:results};
  if(failed) console.error("Tape self-tests: "+failed+" of "+results.length+" FAILED", results.filter(function(r){ return !r.ok; }));
  else console.log("Tape self-tests: "+results.length+"/"+results.length+" passed");
  return res;
}
window.tapeTests=function(){ LAST_TESTS=runTests(); return LAST_TESTS; };

/* ==========================================================================
   BOOT
   ========================================================================== */
function boot(){
  load(); applyTheme();
  var params=new URLSearchParams(location.search);
  DEV = location.protocol==="file:" || (params.has("deck") && Core.isLoopback(location));   // never on the public host
  cloudInit();
  if(DEV){
    DEV_PATH=params.get("deck") || "content/deck.json";
    view="boot"; render();
    loadDevDeck().then(function(){ LAST_TESTS=runTests(); if(view==="settings") render(); });
    if(Cloud.sb) Cloud.sb.auth.getSession().then(function(r){ Cloud.session=(r.data && r.data.session)||null; }).catch(function(){});
  } else {
    var cached=readDeckCache();
    if(cached && setDeck(cached.doc, {source:"cache", version:cached.version, updatedAt:cached.updated_at})) go("home");
    else { view="boot"; render(); }
    if(!Cloud.sb){ if(!DECK) go("signin"); }
    else Cloud.sb.auth.getSession().then(function(r){
      Cloud.session=(r.data && r.data.session)||null;
      if(Cloud.session) refreshDeck(false); else if(!DECK) go("signin");
    }).catch(function(){ if(!DECK) go("signin"); });
  }
  LAST_TESTS=runTests();
}
boot();

/* Offline support: best-effort registration; file:// has no service worker and still runs. */
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  // The first install also fires controllerchange; only a replacement controller is an update.
  var hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if(!hadController){ hadController=true; return; }
    showUpdateToast();
  });
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
